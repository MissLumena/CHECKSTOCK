services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
      POSTGRES_DB: checkstock
    ports: ["5432:5432"]
    volumes: ["./db/init.sql:/docker-entrypoint-initdb.d/init.sql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U checkstock -d checkstock"]
      interval: 2s
      retries: 30
  app:
    build: .
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://checkstock:checkstock@db:5432/checkstock
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}